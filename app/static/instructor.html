<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instructor view · Socratic Project Tutor</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .wrap { max-width: 960px; margin: 32px auto; padding: 0 16px; display: grid; gap: 16px; }
    h1 { font-family: var(--serif); margin: 0; font-size: 26px; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat { background: var(--paper); border-radius: var(--radius); padding: 10px 14px; min-width: 110px; }
    .stat b { display: block; font-size: 22px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td, th { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .card { padding: 20px; }
    #report { display: grid; gap: 16px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">?</span> Instructor view</div>
    <a href="/" class="link">Student view</a>
  </header>
  <div class="wrap" id="login" hidden>
    <form class="card" id="login-form">
      <h1>Instructor sign-in</h1>
      <p class="muted small" id="login-msg">Enter the instructor password to see student progress.</p>
      <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
      <p><button class="btn" type="submit">Sign in</button></p>
    </form>
  </div>
  <div class="wrap" id="main" hidden>
    <div class="card">
      <h1>Student progress</h1>
      <p class="small"><a href="#" id="signout" class="link">Sign out</a></p>
      <label>Project<select id="pick"></select></label>
    </div>
    <div id="report"></div>
  </div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// The password lives only in this tab's session storage and is sent with each request.
function pw() { try { return sessionStorage.getItem("instructorPassword") || ""; } catch { return ""; } }
function setPw(v) { try { v ? sessionStorage.setItem("instructorPassword", v) : sessionStorage.removeItem("instructorPassword"); } catch {} }
let memoryPw = "";

async function get(path) {
  const r = await fetch(path, { headers: { "X-Instructor-Password": pw() || memoryPw } });
  const body = await r.json().catch(() => ({}));
  if (r.status === 401 || r.status === 503) { showLogin(body.detail); throw new Error(body.detail); }
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

function showLogin(msg) {
  setPw(""); memoryPw = "";
  $("#main").hidden = true;
  $("#login").hidden = false;
  if (msg) $("#login-msg").textContent = msg;
  $("#password").value = "";
  $("#password").focus();
}

$("#login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  memoryPw = $("#password").value;
  setPw(memoryPw);
  init().catch(() => {});
});
$("#signout").addEventListener("click", (e) => { e.preventDefault(); showLogin("Signed out."); });

async function init() {
  if (!pw() && !memoryPw) { showLogin(); return; }
  const projects = await get("/api/projects");
  $("#login").hidden = true;
  $("#main").hidden = false;
  if (!projects.length) { $("#report").innerHTML = '<div class="card muted">No student projects yet.</div>'; return; }
  $("#pick").innerHTML = projects.map((p) => `<option value="${p.id}">${esc(p.student_name)}: ${esc(p.brief.slice(0, 60))}</option>`).join("");
  $("#pick").onchange = load;
  load();
}

async function load() {
  const r = await get(`/api/projects/${$("#pick").value}/report`);
  const v = r.verdicts;
  const stages = r.stages.map((s) => `<tr><td><b>${esc(s.name)}</b><br><span class="muted small">${s.status}</span></td><td>${
    s.concepts.map((c) => `${c.mastered ? "✓" : c.needs_review ? "⚑" : "·"} ${esc(c.name)}${c.needs_review ? ' <span class="tag hint">revisit</span>' : ""} <span class="muted small">(tier ${c.highest_tier_passed}/${c.required_tier})</span>`).join("<br>")}</td></tr>`).join("");
  const mis = r.misconceptions.length
    ? r.misconceptions.map((m) => `<tr><td>${esc(m.concept)}</td><td>${m.tier}</td><td>${esc(m.misconception)}</td></tr>`).join("")
    : '<tr><td colspan="3" class="muted">None recorded</td></tr>';
  const sig = r.integrity_signals.length
    ? r.integrity_signals.map((s) => `<tr><td><span class="tag hint">${esc(s.kind)}</span></td><td>${esc(s.detail)}</td><td class="small"><b>Q:</b> ${esc(s.question)}<br><b>A:</b> ${esc(s.answer)}</td></tr>`).join("")
    : '<tr><td colspan="3" class="muted">No signals</td></tr>';
  $("#report").innerHTML = `
    <div class="card"><div class="stats">
      <div class="stat"><b>${r.answers}</b>answers</div>
      <div class="stat"><b>${v.pass}</b>pass</div><div class="stat"><b>${v.partial}</b>partial</div>
      <div class="stat"><b>${v.misconception}</b>misconception</div><div class="stat"><b>${v.evasive}</b>evasive</div>
    </div></div>
    <div class="card"><h2>Mastery by stage</h2><p class="muted small">Pace: ${esc(r.pace)}. ⚑ revisit = the student ran out of attempts, so the tutor explained the concept and moved on. Good topics for the viva.</p><table>${stages}</table></div>
    <div class="card"><h2>Misconceptions</h2><table><tr><th>Concept</th><th>Tier</th><th>Wrong belief</th></tr>${mis}</table></div>
    <div class="card"><h2>Integrity signals</h2><p class="muted small">${esc(r.note)}</p>
      <table><tr><th>Signal</th><th>Detail</th><th>Exchange</th></tr>${sig}</table></div>`;
}
init().catch(() => {});
</script>
</body>
</html>
